    .home {

    .home-text h1 {

    color: #2d2d2d;
    line-height: 1.4;
    margin-bottom: 90px;
    }

    .projects-preview {
    display: flex;

    .projects-preview img {

   .logo:hover {
   color: #555;
   }

    .nav-links a {
    text-decoration: none;
    color: #8c8c8c;
    margin-left: 30px;
    transition: 0.5s;
    }

    .nav-links a:hover {
    color: #555;
    }

    .hero {

}

@media (max-width: 768px) {

}

    .hero h1 {

}

@media (max-width: 768px) {

img {

}

@media (max-width: 768px) {

}
